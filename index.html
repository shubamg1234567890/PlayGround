<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>

</style></head><body>
<canvas id="c"></canvas><div id="hud">
<div id="score"><div class="team" id="blue">0</div><div class="mid"><div id="goalName">TURBO GOAL</div><div id="time">3:00</div></div><div class="team red" id="red">0</div></div>
<div id="boostWrap"><div id="boostLabel">BOOST</div><div class="boostbg"><i id="boostbar"></i></div></div><div id="item">—</div><div id="banner"></div>
<div id="start"><div class="panel"><h1>TURBO <span>GOAL</span></h1><p>Outdrive the CPU. Score in the red goal. Use items to rule the arena.</p><button id="play">KICK OFF</button><div class="controls"><span><b>W</b><b>A</b><b>S</b><b>D</b> Drive</span><span><b>⇧</b> Boost</span><span><b>SPACE</b> Item</span></div></div></div>
<div id="gameover" style="display:none"><div class="panel"><h1 id="result">BLUE WINS</h1><p id="finalscore"></p><button id="again">PLAY AGAIN</button></div></div>
<div id="touch"><div id="steer"><div id="stick"></div></div><div class="pedal" id="gas">BOOST</div><div class="pedal reverse" id="brake">BRAKE</div><div class="pedal jump" id="jump">JUMP</div><div class="itemkey" id="useitem">◆</div></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')useItem()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let running=false,paused=false,last=0,timeLeft=180,blue=0,red=0,flash=0,shake=0;
const world={w:1000,h:650};
const car={x:-180,y:100,a:-Math.PI/2,vx:0,vy:0,boost:100,item:null,shield:0,jump:0,jv:0,hit:0};
const cpu={x:180,y:-100,a:Math.PI/2,vx:0,vy:0,boost:100,item:null,shield:0,jump:0,jv:0,hit:0};
let ball={x:0,y:0,z:35,vx:0,vy:0,vz:0},projectiles=[],pickups=[];
function resetBall(side=0){ball={x:0,y:side*80,z:32,vx:0,vy:0,vz:0}}
function resetPositions(){car.x=-180;car.y=100;car.a=-Math.PI/2;car.vx=car.vy=0;cpu.x=180;cpu.y=-100;cpu.a=Math.PI/2;cpu.vx=cpu.vy=0;projectiles=[];resetBall();pickups=[{x:-320,y:-220,active:true,t:0},{x:320,y:-220,active:true,t:0},{x:-320,y:220,active:true,t:0},{x:320,y:220,active:true,t:0},{x:0,y:0,active:true,t:0}]}
const items=['⚡','🛡','🚀','💣'];
function randItem(){return items[Math.floor(Math.random()*items.length)]}
function useItem(){if(!running||car.item==null)return;const c=car,i=c.item;c.item=null;document.getElementById('item').textContent='—';if(i==='⚡'){c.boost=Math.min(100,c.boost+55);banner('BOOST!','#ffcf38')}if(i==='🛡'){c.shield=5;banner('SHIELD','#63caff')}if(i==='🚀'){projectiles.push({x:c.x,y:c.y,z:c.jump+35,a:c.a,team:'blue',type:'rocket',vx:Math.cos(c.a)*460,vy:Math.sin(c.a)*460,t:4})}if(i==='💣'){projectiles.push({x:c.x,y:c.y,z:c.jump+20,a:c.a,team:'blue',type:'mine',vx:-Math.cos(c.a)*40,vy:-Math.sin(c.a)*40,t:8})}}
function banner(t,c){const b=document.getElementById('banner');b.textContent=t;b.style.color=c;b.classList.add('show');clearTimeout(banner.timer);banner.timer=setTimeout(()=>b.classList.remove('show'),850)}
function controlTouch(){let lx=0,ly=0;const steer=document.getElementById('steer'),stick=document.getElementById('stick');function setStick(x,y){lx=x/58;ly=y/58;lx=Math.max(-1,Math.min(1,lx));ly=Math.max(-1,Math.min(1,ly));stick.style.transform=`translate(${lx*58}px,${ly*58}px)`}let down=false;steer.addEventListener('pointerdown',e=>{down=true;steer.setPointerCapture(e.pointerId);move(e)});steer.addEventListener('pointermove',e=>{if(down)move(e)});steer.addEventListener('pointerup',()=>{down=false;lx=ly=0;setStick(0,0)});function move(e){const r=steer.getBoundingClientRect();setStick(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))}
steer._lx=()=>lx;steer._ly=()=>ly;
function hold(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.prevent; keys[key]=true;el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',()=>keys[key]=false);el.addEventListener('pointercancel',()=>keys[key]=false)}hold('gas','shift');hold('brake','s');hold('jump',' ');document.getElementById('useitem').addEventListener('pointerdown',useItem);
return steer}
const steerEl=controlTouch();
function start(){resetPositions();timeLeft=180;blue=red=0;document.getElementById('blue').textContent='0';document.getElementById('red').textContent='0';document.getElementById('start').style.display='none';document.getElementById('gameover').style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}
document.getElementById('play').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);
function project(x,y,z=0){let cx=W/2,cy=H*.54,s=Math.min(W/1120,H/720)*1.05;let yy=y*.55-z*.25;let persp=1/(1+((y+420)/2400));return{x:cx+x*s,y:cy+yy*s,p:persp*s}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>{const q=project(p[0],p[1],p[2]||0);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function ellipse(x,y,r,z=0,color='#fff',alpha=1){const p=project(x,y,z);ctx.globalAlpha=alpha;ctx.beginPath();ctx.ellipse(p.x,p.y,r*p.p,r*p.p*.42,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.globalAlpha=1}
function drawArena(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9eeaff');g.addColorStop(.18,'#6bb9db');g.addColorStop(.19,'#174c25');g.addColorStop(1,'#0b2718');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// arena top
ctx.save();ctx.beginPath();[[world.w/2,world.h/2],[world.w/2,-world.h/2],[-world.w/2,-world.h/2],[-world.w/2,world.h/2]].forEach((p,i)=>{let q=project(p[0],p[1]);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle='#2c7041';ctx.fill();ctx.clip();let q0=project(-world.w/2,-world.h/2),q1=project(world.w/2,world.h/2);ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;for(let x=-1000;x<=1000;x+=100){let a=project(x,-500),b=project(x,500);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(let y=-600;y<=600;y+=100){let a=project(-600,y),b=project(600,y);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.restore();
// borders
poly([[-500,-325],[500,-325],[500,-350],[-500,-350]],'#dce8ed');poly([[-500,325],[500,325],[500,350],[-500,350]],'#dce8ed');poly([[-500,-325],[-525,-325],[-525,325],[-500,325]],'#dce8ed');poly([[500,-325],[525,-325],[525,325],[500,325]],'#dce8ed');
// goals
poly([[-500,-160],[-500,160],[-570,130],[-570,-130]],'rgba(31,139,255,.45)','#77c4ff');poly([[500,-160],[500,160],[570,130],[570,-130]],'rgba(255,69,84,.45)','#ff8993');
// center circle and line
ellipse(0,0,90,0,'rgba(255,255,255,.08)',1);ellipse(0,0,68,0,'rgba(255,255,255,.14)',1);poly([[-5,-325],[5,-325],[5,325],[-5,325]],'rgba(255,255,255,.35)');
// stands
ctx.fillStyle='#26344a';ctx.fillRect(0,0,W,Math.max(30,H*.15));ctx.fillStyle='#315279';for(let x=0;x<W;x+=55){ctx.beginPath();ctx.arc(x+20,H*.08,4,0,7);ctx.fill()} }
function drawCar(c,team){let p=project(c.x,c.y,c.jump||0),s=Math.min(W/1120,H/720)*1.05;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-c.a+Math.PI/2);ctx.scale(s,s);ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=8;ctx.shadowOffsetY=8;
ctx.fillStyle=team==='blue'?'#168cff':'#ff5060';ctx.beginPath();ctx.roundRect(-27,-42,54,84,12);ctx.fill();ctx.fillStyle='#bfe2ff';ctx.beginPath();ctx.roundRect(-19,-24,38,31,8);ctx.fill();ctx.fillStyle=team==='blue'?'#0759ad':'#b52131';ctx.fillRect(-26,-28,52,8);ctx.fillStyle='#111';ctx.fillRect(-31,-28,10,22);ctx.fillRect(21,-28,10,22);ctx.fillRect(-31,18,10,22);ctx.fillRect(21,18,10,22);ctx.fillStyle='#ffe24d';ctx.fillRect(-20,-43,12,5);ctx.fillRect(8,-43,12,5);ctx.restore();ctx.shadowColor='transparent';if(c.shield>0){ctx.strokeStyle=team==='blue'?'#75dcff':'#ff8394';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(p.x,p.y,38*s,20*s,0,0,7);ctx.stroke()}}
function drawBall(){let p=project(ball.x,ball.y,ball.z);let r=16*p.p*Math.min(W/1000,H/700);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=8;ctx.shadowOffsetY=7;ctx.fillStyle='#f7f8f1';ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='#26313a';for(let i=0;i<5;i++){let a=i*1.256+ball.x*.002;ctx.beginPath();ctx.arc(p.x+Math.cos(a)*r*.45,p.y+Math.sin(a)*r*.38,r*.18,0,7);ctx.fill()} }
function drawPickups(dt){for(const q of pickups){if(!q.active)continue;q.t+=dt;ellipse(q.x,q.y,22,0,'rgba(255,255,255,.12)');let p=project(q.x,q.y,33+Math.sin(q.t*3)*5);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(q.t*.8);ctx.fillStyle='#ffcf38';ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4;let rr=i%2?22:17;let x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#b36b00';ctx.font='900 24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',0,2);ctx.restore()}}
function drive(c,isCPU,dt){let speed=Math.hypot(c.vx,c.vy);if(isCPU){let targetA=Math.atan2(ball.y-c.y,ball.x-c.x);let diff=Math.atan2(Math.sin(targetA-c.a),Math.cos(targetA-c.a));c.a+=Math.max(-2.2*dt,Math.min(2.2*dt,diff));let forward=Math.cos(c.a)*(ball.x-c.x)+Math.sin(c.a)*(ball.y-c.y);if(forward>30)c.vx+=Math.cos(c.a)*280*dt;c.vy+=Math.sin(c.a)*280*dt;if(speed>320){c.vx*=.985;c.vy*=.985}else{}if(Math.hypot(ball.x-c.x,ball.y-c.y)<100){}if(c.item&&Math.random()<.012)c.item=null}
else{let lx=0,ly=0;if(steerEl&&matchMedia('(pointer:coarse)').matches){lx=steerEl._lx();ly=steerEl._ly()}else lx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(!matchMedia('(pointer:coarse)').matches)ly=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);c.a+=lx*2.1*dt*(speed>20?1:.35);let throttle=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?0.58:0);if(matchMedia('(pointer:coarse)').matches)throttle=-ly*.9;
let boost=(keys.shift||keys[' ']&&false)&&c.boost>0;if(boost){c.boost-=30*dt}else c.boost=Math.min(100,c.boost+8*dt);if(throttle){let pw=(boost?480:300)*throttle;c.vx+=Math.cos(c.a)*pw*dt;c.vy+=Math.sin(c.a)*pw*dt}if(keys[' ']){ } }
// friction and movement
let max=c.boost>0&&((isCPU?false:(keys.shift))||(c.boost>0&&isCPU&&speed>180))?520:390;c.vx*=1-1.25*dt;c.vy*=1-1.25*dt;speed=Math.hypot(c.vx,c.vy);if(speed>max){c.vx=c.vx/speed*max;c.vy=c.vy/speed*max}c.x+=c.vx*dt;c.y+=c.vy*dt;
// jump
if(!isCPU&&keys[' ']){}if(!isCPU&&(keys[' '].pressed)){ } }
function update(dt){dt=Math.min(dt,.033);timeLeft-=dt;if(timeLeft<=0){endGame();return}
// car controls
let lx=0;if(steerEl&&matchMedia('(pointer:coarse)').matches)lx=steerEl._lx();else lx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
let throttled=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?.65:0);if(matchMedia('(pointer:coarse)').matches)throttled=-steerEl._ly()*1.15;let speed=Math.hypot(car.vx,car.vy);car.a+=lx*2.15*dt*(speed>15?1:.35);if(throttled){let boost=keys.shift&&car.boost>0;if(boost)car.boost-=28*dt;else car.boost=Math.min(100,car.boost+7*dt);let pwr=(boost?500:330)*throttled;car.vx+=Math.cos(car.a)*pwr*dt;car.vy+=Math.sin(car.a)*pwr*dt}else car.boost=Math.min(100,car.boost+9*dt);
if(keys.shift&&car.boost>0&&!throttled){car.boost-=22*dt;car.vx+=Math.cos(car.a)*420*dt;car.vy+=Math.sin(car.a)*420*dt}
if((keys[' ']||keys.touchjump)&&car.jump===0){car.jv=420;car.jump=1}; // handled badly: key jump sticky
if(car.jump){car.jump+=car.jv*dt;car.jv-=900*dt;if(car.jump<0){car.jump=0;car.jv=0}}car.vx*=1-1.18*dt;car.vy*=1-1.18*dt;speed=Math.hypot(car.vx,car.vy);if(speed>430){car.vx*=430/speed;car.vy*=430/speed}car.x+=car.vx*dt;car.y+=car.vy*dt;
// cpu AI
let ta=Math.atan2(ball.y-cpu.y,ball.x-cpu.x),diff=Math.atan2(Math.sin(ta-cpu.a),Math.cos(ta-cpu.a));cpu.a+=Math.max(-2.4*dt,Math.min(2.4*dt,diff));let cp=Math.cos(cpu.a)*(ball.x-cpu.x)+Math.sin(cpu.a)*(ball.y-cpu.y);if(cp>-200){cpu.vx+=Math.cos(cpu.a)*360*dt;cpu.vy+=Math.sin(cpu.a)*360*dt}else{cpu.a+=Math.sin(performance.now()*0.001)*dt};cpu.vx*=.985;cpu.vy*=.985;speed=Math.hypot(cpu.vx,cpu.vy);if(speed>340){cpu.vx*=340/speed;cpu.vy*=340/speed}cpu.x+=cpu.vx*dt;cpu.y+=cpu.vy*dt;if(cpu.item&&Math.random()<.005){cpu.item=null}
// walls
for(const c of [car,cpu]){if(c.x>450){c.x=450;c.vx=-Math.abs(c.vx)*.55}if(c.x<-450){c.x=-450;c.vx=Math.abs(c.vx)*.55}if(c.y>300){c.y=300;c.vy=-Math.abs(c.vy)*.55}if(c.y<-300){c.y=-300;c.vy=Math.abs(c.vy)*.55}}
// ball
ball.vx*=.998;ball.vy*=.998;if(ball.z>32||ball.vz!==0){ball.vz-=900*dt;ball.z+=ball.vz*dt;if(ball.z<32){ball.z=32;ball.vz*=-.38;if(Math.abs(ball.vz)<20)ball.vz=0}}
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x>430&&ball.y>-160&&ball.y<160){score('red')}if(ball.x<-430&&ball.y>-160&&ball.y<160){score('blue')}if(ball.x>475){ball.x=475;ball.vx=-Math.abs(ball.vx)*.72}if(ball.x<-475){ball.x=-475;ball.vx=Math.abs(ball.vx)*.72}if(ball.y>305){ball.y=305;ball.vy=-Math.abs(ball.vy)*.72}if(ball.y<-305){ball.y=-305;ball.vy=Math.abs(ball.vy)*.72}
for(const c of [car,cpu]){let dx=ball.x-c.x,dy=ball.y-c.y,d=Math.hypot(dx,dy);if(d<52+ball.z*.08){let nx=d?dx/d:1,ny=d?dy/d:0;let pow=c===car?360:330;ball.vx+=nx*pow+c.vx*.65;ball.vy+=ny*pow+c.vy*.65;if(c.jump>25||car===c&&keys.shift)ball.vz=300;ball.x=c.x+nx*58;ball.y=c.y+ny*58}}
// pickups
for(const q of pickups){if(q.active&&Math.hypot(q.x-car.x,q.y-car.y)<55){q.active=false;q.t=0;car.item=randItem();document.getElementById('item').textContent=car.item;banner(car.item==='⚡'?'BOOST':car.item==='🛡'?'SHIELD':car.item==='🚀'?'ROCKET':'MINE','#ffcf38');setTimeout(()=>q.active=true,9000)}}
// projectiles
for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='rocket'){if(Math.hypot(p.x-cpu.x,p.y-cpu.y)<45&&p.team==='blue'){cpu.vx+=p.vx*.5;cpu.vy+=p.vy*.5;p.t=0;if(cpu.shield>0)cpu.shield=0}}else if(p.type==='mine'&&Math.hypot(p.x-cpu.x,p.y-cpu.y)<55){cpu.vx+=Math.cos(p.a)*280;cpu.vy+=Math.sin(p.a)*280;p.t=0}if(p.x<-500||p.x>500||p.y<-330||p.y>330)p.t=0;if(p.t<=0)projectiles.splice(i,1)}
flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);document.getElementById('boostbar').style.width=car.boost+'%';document.getElementById('time').textContent=Math.max(0,Math.ceil(timeLeft/60)).toString().padStart(1,'0')+':'+Math.floor(timeLeft%60).toString().padStart(2,'0')}
function score(team){blue+=team==='blue'?1:0;red+=team==='red'?1:0;document.getElementById(team==='blue'?'blue':'red').textContent=team==='blue'?blue:red;banner(team==='blue'?'BLUE SCORES!':'RED SCORES!',team==='blue'?'#55b4ff':'#ff6875');shake=.35;flash=.45;resetBall(team==='blue'?1:-1)}
function endGame(){running=false;document.getElementById('gameover').style.display='grid';document.getElementById('result').textContent=blue===red?'DRAW GAME':blue>red?'BLUE WINS':'RED WINS';document.getElementById('finalscore').textContent=blue+' — '+red}
function loop(now){if(!running)return;let dt=(now-last)/1000;last=now;update(dt);ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*12,(Math.random()-0.5)*12);drawArena();drawPickups(dt);
// depth sort objects
let objs=[{y:ball.y,type:'ball'}, {y:car.y,type:'car',c:car}, {y:cpu.y,type:'cpu',c:cpu}];objs.sort((a,b)=>a.y-b.y);for(const o of objs){if(o.type==='ball')drawBall();else drawCar(o.c,o.type==='car'?'blue':'red')}
for(const p of projectiles){let q=project(p.x,p.y,28);ctx.fillStyle=p.type==='rocket'?'#ffb52a':'#2a1724';ctx.beginPath();ctx.arc(q.x,q.y,p.type==='rocket'?10:15,0,7);ctx.fill();if(p.type==='rocket'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x-3,q.y-3,3,0,7);ctx.fill()}}if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.25})`;ctx.fillRect(0,0,W,H)}ctx.restore();requestAnimationFrame(loop)}
resetPositions();drawArena();drawBall();drawCar(car,'blue');drawCar(cpu,'red');
// mobile jump key and key cleanup
document.getElementById('jump').addEventListener('pointerdown',()=>{if(car.jump===0){car.jump=1;car.jv=420}});
</script></body></html>
